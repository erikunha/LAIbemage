name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'feature/**']
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs to read the repo contents.
permissions:
  contents: read

jobs:
  ci:
    name: Lint, Typecheck & Test (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Start timestamp for the timing summary at the end of the job
      # (target: full gate < 5 min on a pnpm cache hit).
      - name: Record job start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Audit is advisory, not a gate: `pnpm audit --audit-level=high` currently
      # FAILS with 68 findings (6 low | 24 moderate | 38 high, 0 critical), all in
      # dev/transitive tooling chains (2026-11-10): commitizen>inquirer>lodash/tmp,
      # typedoc>markdown-it/linkify-it, vite/eslint chains (brace-expansion,
      # fast-uri, nanoid, postcss, source-map-js, js-yaml), sharp/libvips+libheif+
      # librsvg CVEs, zod GHSA-mrhx-c7xc-m3w5 (via @modelcontextprotocol/sdk and
      # packages/contracts), @google-cloud/storage>retry-request>form-data,
      # protobufjs, ws. Failures surface in the log but do not block; re-enable the
      # hard gate once this documented list is worked down.
      - name: Audit dependencies (advisory)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      # All Python suites (services smoke, visionlens worker, mock provider)
      # are stdlib-only; only pytest itself is needed (no uv sync).
      # --break-system-packages is required on PEP 668-managed runner images.
      - name: Set up Python (pytest for the Python suites)
        run: python3 -m pip install --user --break-system-packages pytest

      - name: Lint
        run: pnpm lint

      # Covers all workspace packages via turbo (packages/{core,cli,sdk,contracts},
      # apps/{api,studio}) AND the root scripts/ project
      # (tsc -p scripts/tsconfig.json --noEmit runs inside `pnpm typecheck`),
      # plus the type-level tests in packages/core/tests/tsconfig.json.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage (thresholds apply to packages/core)
        run: pnpm test:coverage

      - name: Test Python (services + visionlens worker + mock provider)
        run: pnpm test:py

      # docker/runtime/python/visionlens is a real-file vendor copy of the
      # wheel source (BuildKit contexts cannot follow symlinks); this fails
      # naming any file that drifted from python/visionlens.
      - name: Docker vendor copy matches python/visionlens
        run: pnpm docker:vendor:check

      - name: Build (required by the golden bin tests)
        run: pnpm build

      - name: Golden bin tests (vision-lens + ai-image-labeling compat)
        run: pnpm --filter @vision-lens/cli test:bins

      # removed: README flags-table check (`pnpm readme:check`) — README moved to
      # curated thematic tables (2026-11); generator markers dropped; restore when
      # the generator is redesigned.

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Job timing summary
        if: always()
        run: |
          END=$(date +%s)
          ELAPSED=$((END - JOB_START))
          {
            echo "### CI timing"
            echo "- Total: $((ELAPSED / 60))m $((ELAPSED % 60))s (target: < 5 min on cache hit)"
            echo "- Per-task timings: see the turbo output in the Build/Typecheck steps above."
          } >> "$GITHUB_STEP_SUMMARY"
