name: Release

# Trigger: push a semver tag (e.g. v1.1.0).
# The Release Engineer agent bumps versions and pushes the tag —
# this workflow takes it from there.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write  # needed to create the GitHub Release
  # id-token: write returns together with npm publish (provenance) — see the
  # TODO(publishing-identity) block below.

jobs:
  release:
    name: Build, smoke & GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so the changelog can reference commits

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full gate — same checks CI runs on every PR.
      # (`pnpm typecheck` covers the workspace packages via turbo AND the root
      # scripts/ project; the README flags check was removed — see ci.yml.)
      - name: Lint
        run: pnpm lint

      - name: Typecheck (workspace + scripts)
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      # Turbo workspace build: packages/{core,cli,sdk,contracts} + apps/*
      - name: Build
        run: pnpm build

      # Smoke test the built CLI bin (the old root ./dist/sdk.js import target
      # no longer exists after the monorepo migration — spec 001).
      - name: Smoke test CLI
        run: node packages/cli/dist/index.js --version

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # TODO(publishing-identity): npm publishing is intentionally disabled
      # pending the publishing-identity decision (spec 001).
      # - packages/cli is currently named @vision-lens/cli with private:true
      #   — no workspace package is publishable as-is.
      # - npm continuity for the published name "ai-image-labeling" requires
      #   renaming packages/cli to that name when the identity is decided; the
      #   rename is breaking and must land inside the spec 001 US2 deprecation
      #   window (two minor versions of the `ai-image-labeling` compat bin,
      #   documented in README + CHANGELOG).
      # When decided, restore the publish step (and re-add id-token: write to
      # the job permissions for npm provenance):
      #
      # - name: Publish to npm
      #   run: pnpm --filter @vision-lens/cli publish --no-git-checks --access public
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create a GitHub Release with an auto-generated changelog from the tag range
      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');

            // Find the previous tag to scope the changelog
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10,
            });
            const previousTag = tags.find(t => t.name !== tag)?.name ?? '';

            // Collect commits between the previous tag and this one
            let changelog = '';
            if (previousTag) {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${previousTag}...${tag}`,
              });
              const commits = comparison.commits
                .map(c => `- ${c.commit.message.split('\n')[0]} (${c.sha.slice(0, 7)})`)
                .join('\n');
              changelog = `## Changes since ${previousTag}\n\n${commits}`;
            }

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `v${version}`,
              body: changelog || `Release ${tag}`,
              draft: false,
              prerelease: tag.includes('-'),
            });

      - name: Upload CLI dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist-${{ steps.version.outputs.version }}
          path: packages/cli/dist/
          retention-days: 90
