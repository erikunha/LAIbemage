[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "visionlens"
version = "0.1.0"
description = "Local-first visual AI runtime: deterministic simulated encoder, model registry, and the frozen visionlens.worker.v1 JSONL worker protocol."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# The base install carries Pydantic and nothing else: the typed, versioned
# configuration of the public facade needs it (the pack's base-install policy,
# docs/vnext/05-PYTHON-CORE-AND-PYPI.md:34). The decision is recorded in the
# packaging amendment of ADR-011.
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
# The extra names are frozen; the extra dependency sets stay empty while the
# whole runtime is simulated.
vision = []
training = []
agents = []
server = []
all = []

[tool.hatch.build.targets.wheel]
packages = ["src/visionlens"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

[dependency-groups]
# Development workspace only: never published, never a wheel dependency.
# Ranges here, exact pins in uv.lock (regenerate with `uv lock`).
dev = ["pytest>=9", "mypy>=1.15"]

[tool.uv]
# Reproducible development resolution: nothing released after this instant
# can enter uv.lock. Recorded by uv in uv.lock's [manifest] section.
exclude-newer = "2026-11-12T00:00:00Z"

[tool.mypy]
# Type checker gate over the shipped sources; zero errors is the bar.
files = ["src/visionlens"]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
