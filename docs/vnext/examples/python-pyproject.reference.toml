# Illustration only. Do not replace existing service pyprojects in place.
[project]
name = "visionlens"
version = "0.1.0"
requires-python = ">=3.11"
description = "Local-first visual AI engineering Python library"
readme = "README.md"
license = "MIT"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
vision = ["numpy>=1.26", "pillow>=10", "torch>=2.4", "transformers>=4"]
training = ["scikit-learn>=1.5", "mlflow>=2"]
agents = ["langgraph>=1"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visionlens"]
